<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Test Bench</title>
    <style>
      :root {
        --bg: #10201a;
        --panel: #182d24;
        --line: #2b4a3c;
        --text: #e6efe9;
        --muted: #9db5a8;
        --accent: #8fd18b;
        --btn: #23412f;
        --btn-hover: #2e5640;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 4px 0 12px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      button {
        background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 10px; font: inherit; cursor: pointer;
      }
      button:hover { background: var(--btn-hover); }
      button.primary { background: var(--accent); color: #10201a; border-color: var(--accent); font-weight: 600; }
      .row { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 8px; margin: 4px 0; }
      .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      label.chk { display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; }
      #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/tools/audioTest.ts"></script>
  </body>
</html>
